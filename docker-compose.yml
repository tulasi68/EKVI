services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ekvi
      POSTGRES_PASSWORD: ekvi
      POSTGRES_DB: ekvi
    ports:
      - "5432:5432"
    volumes:
      - ekvi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekvi -d ekvi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ekvi_pgdata:
